services:
  web:
    build: .
    container_name: php_lab10_container
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db


  db:
    image: mysql:5.7
    container_name: mysql_lab10
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: real_estate
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_lab10
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  mysql_data:
